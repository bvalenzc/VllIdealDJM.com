  background-attachment:fixed,fixed,fixed;
}
body::before,body::after{content:'';position:fixed;width:40vmax;height:40vmax;z-index:0;pointer-events:none;}
body::before{top:-21vmax;left:-21vmax;clip-path:polygon(0 0,100% 0,0 100%);
  background:linear-gradient(135deg, transparent calc(50% - 1.5px), rgba(232,197,101,.55) calc(50% - 1.5px), rgba(232,197,101,.55) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(135deg,#0a0906,#231d10 55%,#0a0906);}
body::after{bottom:-21vmax;right:-21vmax;clip-path:polygon(100% 100%,0 100%,100% 0);
  background:linear-gradient(135deg, transparent calc(50% - 1.5px), rgba(232,197,101,.55) calc(50% - 1.5px), rgba(232,197,101,.55) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(135deg,#0a0906,#231d10 55%,#0a0906);}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px 90px;}
#crest-watermark{position:fixed;top:6%;left:50%;transform:translateX(-50%);width:105vmin;height:105vmin;background-repeat:no-repeat;background-position:center;background-size:contain;opacity:.05;z-index:0;pointer-events:none;filter:grayscale(1);}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shine{0%{background-position:-160% 0;}100%{background-position:160% 0;}}
@keyframes popIn{0%{transform:scale(.55);opacity:0;}55%{transform:scale(1.14);opacity:1;}100%{transform:scale(1);}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(232,197,101,.55);}100%{box-shadow:0 0 0 16px rgba(232,197,101,0);}}
@keyframes floatDot{0%,100%{transform:translateY(0);opacity:.35;}50%{transform:translateY(-18px);opacity:.9;}}
@keyframes confettiFall{to{transform:translateY(115vh) rotate(var(--rot));opacity:0;}}
@keyframes drawLine{from{opacity:0;transform:scaleX(0);}to{opacity:1;transform:scaleX(1);}}
@keyframes drawCircle{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:6px auto;animation:spin .7s linear infinite;}
.wrap{width:100%;max-width:640px;animation:fadeInUp .4s ease both;}
.display{font-family:'Playfair Display',serif;}
.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600;}
.header{text-align:center;margin-bottom:16px;position:relative;}
.crest-wrap{width:112px;height:112px;margin:0 auto 8px;position:relative;}
.crest{width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(20,15,5,.35));display:block;position:relative;z-index:1;}
.crest-wrap::after{content:'';position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle, rgba(232,197,101,.35), transparent 70%);z-index:0;filter:blur(2px);}
.header .title{font-size:clamp(30px,9vw,46px);font-weight:800;line-height:1;margin:4px 0 0;letter-spacing:.5px;font-family:'Cinzel',serif;}
.header .title .g{background:linear-gradient(180deg,var(--gold-light),var(--gold) 55%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;}
.header .subtitle{color:var(--muted);font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;margin-top:8px;font-weight:600;}
.header .tagline{color:var(--ink);font-size:13px;font-family:'Playfair Display';font-style:italic;margin-top:6px;opacity:.75;}
.gold-rule{width:56px;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px auto;}
.card{background:var(--white);border:1px solid var(--line);border-radius:3px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,17,10,.04), 0 14px 28px rgba(20,17,10,.07);}
.btn{font-family:'Inter';font-weight:700;border:none;border-radius:2px;padding:13px 18px;cursor:pointer;font-size:13.5px;letter-spacing:.6px;transition:transform .1s ease, opacity .15s ease, box-shadow .2s ease;width:100%;}
.btn:active{transform:scale(0.98);}
.btn-gold{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1c1600;text-transform:uppercase;letter-spacing:1.5px;box-shadow:0 4px 12px rgba(181,146,46,.35);}
.btn-gold:not(:disabled):hover{box-shadow:0 6px 18px rgba(181,146,46,.5);}
.btn-outline{background:transparent;border:1.5px solid var(--gold);color:var(--gold-deep);text-transform:uppercase;letter-spacing:1.5px;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;}
input[type=text],input[type=password]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:13px;border-radius:4px;font-size:16px;font-family:'Inter';margin-bottom:10px;transition:border-color .15s ease;}
input[type=text]:focus,input[type=password]:focus{border-color:var(--gold);}
input:focus{outline:none;}
label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;}
.error{color:var(--red);font-size:13px;margin:-2px 0 10px;}
.q-title{font-size:23px;margin:0 0 4px;color:var(--ink);font-weight:800;}
.q-desc{color:var(--muted);font-size:13px;margin-bottom:14px;}
.small-muted{color:var(--muted);font-size:12px;}
.center{text-align:center;}
.mt8{margin-top:8px;}
.mt16{margin-top:16px;}

/* ---- progress pill ---- */
.progress-pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--gold-light);padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:12px;}
.progress-pill .track{width:64px;height:5px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;}
.progress-pill .fill{height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold-light));border-radius:4px;transition:width .35s ease;}
.progress-pill.complete{animation:ringPulse 1.1s ease-out;background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1c1600;}

/* ---- scroll panel ---- */
.pool-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:10px;margin-bottom:4px;scroll-snap-type:x proximity;}
.pool-scroll::-webkit-scrollbar{height:5px;}
.pool-scroll::-webkit-scrollbar-track{background:var(--bg2);border-radius:4px;}
.pool-scroll::-webkit-scrollbar-thumb{background:var(--gold);border-radius:4px;}

/* ---- FUT-style holographic card ---- */
.grid{display:flex;flex-wrap:nowrap;gap:10px;width:max-content;}
.grid .fc-outer{flex:0 0 122px;scroll-snap-align:start;}
.fc-outer{aspect-ratio:0.72;clip-path:polygon(50% 0%,88% 6%,100% 20%,100% 92%,90% 100%,10% 100%,0% 92%,0% 20%,12% 6%);background:linear-gradient(160deg,var(--gold-light),var(--gold) 45%,var(--gold-deep));padding:2.5px;cursor:pointer;position:relative;transition:transform .15s ease,filter .15s ease;filter:drop-shadow(0 5px 9px rgba(20,17,10,.28));}
.fc-outer.parche{background:linear-gradient(160deg,var(--red-light),var(--red) 45%,#4e0e14);}
.fc-outer.selected{transform:translateY(-6px) scale(1.02);filter:drop-shadow(0 10px 18px rgba(181,146,46,.6));}
.fc-outer.disabled{opacity:.32;pointer-events:none;}
.fc-outer.pop{animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
.fc-outer:hover .fc-shine, .fc-outer.selected .fc-shine{opacity:1;animation:shine 1.1s ease;}
.fc-inner{clip-path:polygon(50% 0%,88% 6%,100% 20%,100% 92%,90% 100%,10% 100%,0% 92%,0% 20%,12% 6%);width:100%;height:100%;background:linear-gradient(165deg,#211e17,#040403 72%);display:flex;flex-direction:column;align-items:center;padding:8% 5% 5%;color:var(--gold-light);text-align:center;position:relative;overflow:hidden;}
.fc-shine{position:absolute;inset:0;opacity:0;pointer-events:none;background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.5) 50%, transparent 58%);background-size:250% 250%;background-position:-160% 0;}
.fc-star{font-size:9px;color:var(--gold);margin-bottom:3%;letter-spacing:2px;position:relative;z-index:1;}
.fc-photo{width:64%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#2c2a22;margin-bottom:5%;border:1px solid rgba(232,197,101,.45);flex-shrink:0;position:relative;z-index:1;}
.fc-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.fc-photo .fc-initials{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:800;font-size:17px;color:var(--gold-light);}
.fc-name{font-family:'Playfair Display';font-weight:700;font-size:12.5px;color:var(--white);line-height:1.1;margin-bottom:2px;position:relative;z-index:1;}
.fc-pos{font-size:8px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold-light);opacity:.85;position:relative;z-index:1;}
.fc-stats{font-size:8.5px;color:#aba28e;margin-top:4px;letter-spacing:.2px;padding-top:4px;border-top:1px solid rgba(232,197,101,.25);width:78%;position:relative;z-index:1;}
.fc-parche-tag{font-size:7.5px;letter-spacing:1px;color:var(--red-light);text-transform:uppercase;margin-top:2px;font-weight:700;position:relative;z-index:1;}

/* pool section headers + tabs */
.pool-heading{font-family:'Playfair Display';font-size:14px;font-weight:700;color:var(--ink);margin:14px 0 8px;display:flex;align-items:center;gap:8px;}
.pool-heading .line{flex:1;height:1px;background:var(--line);}
.swipe-hint{font-size:9px;letter-spacing:1px;text-transform:none;color:var(--gold-deep);font-weight:600;opacity:.75;}
.tabs-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0;margin-bottom:16px;row-gap:8px;}
.tab-pill{font-family:'Inter';font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;padding:2px 12px;color:var(--muted);cursor:pointer;font-weight:700;background:transparent;border:none;border-bottom:2px solid transparent;transition:color .15s ease;}
.tab-pill:not(:last-child){border-right:1px solid var(--line);}
.tab-pill.active{color:var(--gold-deep);border-bottom-color:var(--gold);}

.overlay{position:fixed;inset:0;background:rgba(8,6,3,.74);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--white);border:1px solid var(--gold);border-radius:3px;padding:24px;max-width:400px;width:100%;animation:popIn .3s ease;}
.modal h3{margin:0 0 10px;font-family:'Playfair Display';color:var(--ink);font-size:21px;}
.modal p{color:var(--ink);font-size:14px;margin-bottom:18px;line-height:1.55;}

/* ---- pitch ---- */
.pitch-field{position:relative;width:100%;aspect-ratio:0.62;background:linear-gradient(180deg,#fdfcf7,#f0ecdd);border:1.5px solid var(--gold);border-radius:5px;overflow:hidden;margin-bottom:8px;box-shadow:inset 0 0 30px rgba(181,146,46,.07), 0 12px 30px rgba(20,17,10,.1);}
.pitch-field .hline{position:absolute;left:6%;right:6%;top:50%;height:1px;background:var(--gold);opacity:.4;animation:drawLine .6s ease .1s both;}
.pitch-field .ccircle{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:1px solid var(--gold);border-radius:50%;opacity:.4;transform:translate(-50%,-50%);animation:drawCircle .5s ease .25s both;}
.pitch-field .border-in{position:absolute;left:5%;right:5%;top:4%;bottom:4%;border:1px solid var(--gold);opacity:.25;}
.pitch-field .spark{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold-light);animation:floatDot 3.4s ease-in-out infinite;pointer-events:none;}
.slot-card{position:absolute;width:20%;transform:translate(-50%,-50%);}
.slot-empty .fc-outer{background:linear-gradient(160deg,#d8d2bd,#b7ae94);}
.slot-empty .fc-inner{background:linear-gradient(165deg,#f7f5ec,#e9e4d2);color:var(--muted);}
.slot-empty .fc-pos{color:var(--gold-deep);font-weight:700;font-size:8px;}
.pitch-complete .pitch-field{border-color:var(--gold-light);box-shadow:inset 0 0 40px rgba(232,197,101,.18), 0 0 30px rgba(232,197,101,.28), 0 12px 30px rgba(20,17,10,.1);}

/* ---- formation mini-pitch preview cards ---- */
.formation-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
.formation-btn{background:var(--white);border:1.5px solid var(--line);border-radius:6px;padding:12px 10px 10px;text-align:center;cursor:pointer;transition:border-color .15s ease, transform .1s ease;}
.formation-btn:hover,.formation-btn:active{border-color:var(--gold);transform:translateY(-2px);}
.formation-btn .mini-pitch{width:100%;aspect-ratio:0.85;margin-bottom:6px;}
.formation-btn .fk{font-family:'Cinzel';font-weight:700;font-size:15px;color:var(--ink);letter-spacing:.5px;}

.pool-hint{color:var(--muted);font-size:12px;text-align:center;margin:8px 0 14px;letter-spacing:.5px;}
.thanks{text-align:center;padding:38px 10px;}
.thanks .big{font-size:44px;color:var(--gold);}
.ideal-image-preview{max-width:260px;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 10px 26px rgba(20,17,10,.28);border:1px solid var(--line);}
.ideal-image-preview img{width:100%;display:block;}
.admin-corner{position:fixed;bottom:10px;right:10px;font-size:10px;color:#cdc6ac;background:transparent;border:none;cursor:pointer;letter-spacing:.5px;padding:6px;z-index:40;}
.ideal-log-card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:10px;}
.ideal-log-card .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;}
.ideal-log-players{display:flex;flex-wrap:wrap;gap:6px;}
.ideal-chip{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:11px;}
.ideal-chip.parche{border-color:var(--red);color:var(--red);}

/* ---- admin analytics ---- */
.admin-section-title{font-family:'Playfair Display';font-weight:700;font-size:16px;color:var(--ink);margin-bottom:10px;text-align:left;}
.bar-row{margin-bottom:14px;}
.bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.bar-name{font-weight:700;}
.bar-pct{color:var(--gold-deep);font-weight:700;}
.bar-bg{background:var(--bg2);border-radius:4px;height:8px;overflow:hidden;}
.bar-fill{background:linear-gradient(90deg,var(--gold-deep),var(--gold-light));height:100%;border-radius:4px;transition:width .4s ease;}
.bar-fill.leading{box-shadow:0 0 8px rgba(232,197,101,.6);}
.trophy{filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
.voters-inline{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic;}
.consensus-badge{position:absolute;top:-8px;right:-4px;background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1c1600;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:10px;z-index:2;box-shadow:0 2px 4px rgba(0,0,0,.25);}

/* ---- confetti ---- */
.confetti-piece{position:fixed;top:-24px;width:8px;height:14px;z-index:200;pointer-events:none;animation:confettiFall linear forwards;}
</style>
</head>

<script>
/* ---------- STORAGE SHIM (para cuando esta página NO corre dentro de Claude) ---------- */
// Si window.storage ya existe (estamos dentro de un artifact de Claude), no hace nada.
// Si NO existe (la página está en hosting independiente), la reemplaza por una
// conexión a Google Sheets vía Apps Script, usando la misma interfaz.
(function(){
  if (window.storage) return;

  // PEGA AQUÍ la URL que termina en /exec después de implementar el Apps Script
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxzDHQWzBhyIljjgFp2tZ9-Pyh27x7luaHVBlb5229uSlHmeHChd0CxVNXBgtlruVpXjw/exec';

  async function postAction(action, extra){
    try{
      await fetch(GAS_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(Object.assign({action:action}, extra))
      });
      return true;
    }catch(e){ console.error('storage-shim post failed', e); return false; }
  }
  async function getAction(action, params){
    try{
      var url = GAS_URL + '?' + new URLSearchParams(Object.assign({action:action}, params)).toString();
      var res = await fetch(url);
      return await res.json();
    }catch(e){ console.error('storage-shim get failed', e); return null; }
  }

  window.storage = {
    async set(key, value){ await postAction('set', {key:key, value:value}); return {key:key, value:value}; },
    async get(key){ var r = await getAction('get', {key:key}); return (r && r.value !== undefined && r.value !== null) ? {value:r.value} : null; },
    async list(prefix){ var r = await getAction('list', {prefix:prefix||''}); return {keys: (r && r.keys) ? r.keys : []}; },
    async delete(key){ await postAction('delete', {key:key}); return {key:key, deleted:true}; },
  };
})();

/* ---------- HELPERS ---------- */
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}
function avatarInner(p){
  const photo = PLAYER_PHOTOS[p.id];
  return photo ? '<img src="'+photo+'" alt="'+escapeHtml(p.name)+'">' : '<div class="fc-initials">'+initials(p.name)+'</div>';
}

/* ---------- STORAGE ---------- */
async function submitIdeal(payload){
  const key = 'ideal7:'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
  try{ await window.storage.set(key, JSON.stringify(payload), true); }catch(e){ console.error('ideal save failed', e); }
}
async function getAllIdeal(){
  try{
    const list = await window.storage.list('ideal7:', true);
    if(!list || !list.keys) return [];
    const out = [];
    for(const k of list.keys){
      try{ const r = await window.storage.get(k, true); if(r) out.push(JSON.parse(r.value)); }catch(e){}
    }
    return out.sort((a,b)=>b.ts-a.ts);
  }catch(e){ return []; }
}
async function wipeAll(){
  try{
    const list = await window.storage.list('ideal7:', true);
    if(list && list.keys) for(const k of list.keys){ try{ await window.storage.delete(k, true); }catch(e){} }
  }catch(e){}
}
async function ensureVersion(){
  try{
    let stored = null;
    try{ const r = await window.storage.get('meta:app_version', true); stored = r ? r.value : null; }catch(e){ stored = null; }
    if(stored !== APP_VERSION){
      await wipeAll();
      try{ await window.storage.set('meta:app_version', APP_VERSION, true); }catch(e){}
    }
  }catch(e){ console.error(e); }
}

/* ---------- SLOT LAYOUT ---------- */
function getSlotPositions(formationKey){
  const f = FORMATIONS[formationKey];
  const rows = [
    {role:'DEL', label:'Delantero', count:f.del, y:14},
    {role:'MED', label:'Medio', count:f.med, y:42},
    {role:'DEF', label:'Defensa', count:f.def, y:68},
    {role:'GK', label:'Arquero', count:1, y:90},
  ];
  let slots=[];
  rows.forEach(row=>{
    const n=row.count;
    for(let i=0;i<n;i++){
      const x = (86/(n+1))*(i+1) + 7;
      slots.push({id:row.role+i, role:row.role, label:row.label, x, y:row.y});
    }
  });
  return slots;
}
function miniPitchSvg(formationKey){
  const slots = getSlotPositions(formationKey);
  const dots = slots.map(s=>'<circle cx="'+s.x+'" cy="'+s.y+'" r="5.5" fill="url(#mpg)"/>').join('');
  return '<svg class="mini-pitch" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><linearGradient id="mpg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8c565"/><stop offset="100%" stop-color="#6e5717"/></linearGradient></defs>'+
    '<rect x="4" y="4" width="92" height="92" fill="none" stroke="#ded6bd" stroke-width="1.5" rx="3"/>'+
    '<line x1="4" y1="50" x2="96" y2="50" stroke="#ded6bd" stroke-width="1"/>'+
    '<circle cx="50" cy="50" r="12" fill="none" stroke="#ded6bd" stroke-width="1"/>'+
    dots+
  '</svg>';
}

/* ---------- CONFETTI ---------- */
function fireConfetti(){
  const colors = ['#e8c565','#b5922e','#fffdf8','#6e5717'];
  const count = 46;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const left = Math.random()*100;
    const duration = 2.2 + Math.random()*1.4;
    const delay = Math.random()*0.35;
    const rot = (Math.random()*720-360)+'deg';
    el.style.left = left+'vw';
    el.style.background = colors[i%colors.length];
    el.style.setProperty('--rot', rot);
    el.style.animationDuration = duration+'s';
    el.style.animationDelay = delay+'s';
    el.style.borderRadius = (i%3===0) ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(()=>{ el.remove(); }, (duration+delay)*1000+200);
  }
}

/* ---------- TOTY IMAGE GENERATION ---------- */
function loadImageEl(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function fitText(ctx, text, maxWidth, baseFont){
  let size = parseInt(baseFont, 10);
  let fontFam = baseFont.replace(/^\d+px\s*/, '');
  while(size > 12){
    ctx.font = size+'px '+fontFam;
    if(ctx.measureText(text).width <= maxWidth) break;
    size -= 1;
  }
  return size+'px '+fontFam;
}

async function drawPlayerCardOnCanvas(ctx, p, cx, cy, w, h, fallbackLabel){
  const x = cx - w/2, y = cy - h/2;
  const isParche = p && p.isParche;
  const borderColor = isParche ? '#c9525c' : '#e8c565';
  roundRectPath(ctx, x, y, w, h, 16);
  const cardGrad = ctx.createLinearGradient(x, y, x, y+h);
  cardGrad.addColorStop(0, '#26211a');
  cardGrad.addColorStop(1, '#070604');
  ctx.save();
  ctx.fillStyle = cardGrad;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = borderColor;
  ctx.stroke();
  ctx.save();
  roundRectPath(ctx, x, y, w, h, 16);
  ctx.clip();

  ctx.textAlign = 'center';
  if(p){
    const photoSrc = PLAYER_PHOTOS[p.id];
    const pSize = w*0.6;
    const px = cx, py = y + h*0.13 + pSize/2;
    if(photoSrc){
      try{
        const img = await loadImageEl(photoSrc);
        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, pSize/2, 0, Math.PI*2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, px-pSize/2, py-pSize/2, pSize, pSize);
        ctx.restore();
      }catch(e){}
    }
    ctx.strokeStyle = 'rgba(232,197,101,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, pSize/2, 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = '#f5f1e4';
    ctx.font = fitText(ctx, p.name, w*0.86, '22px Playfair Display');
    ctx.fillText(p.name, cx, y + h*0.72);

    ctx.fillStyle = '#e8c565';
    ctx.font = '600 13px Inter';
    ctx.fillText(p.pos.join(' / ').toUpperCase(), cx, y + h*0.80);

    ctx.strokeStyle = 'rgba(232,197,101,.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x+w*0.18, y+h*0.85);
    ctx.lineTo(x+w*0.82, y+h*0.85);
    ctx.stroke();

    ctx.fillStyle = 'rgba(233,228,210,.7)';
    ctx.font = '500 13px Inter';
    ctx.fillText('PJ '+p.pj+' · '+p.goles+'G · '+p.asist+'A', cx, y + h*0.93);

    if(isParche){
      ctx.fillStyle = '#c9525c';
      ctx.font = '700 11px Inter';
      ctx.fillText('PARCHE', cx, y + h*0.985);
    }
  } else {
    ctx.fillStyle = 'rgba(233,228,210,.45)';
    ctx.font = '600 15px Inter';
    ctx.fillText(fallbackLabel||'', cx, cy);
  }
  ctx.restore();
  ctx.restore();
}

  try{

      document.fonts.load('800 90px "Playfair Display"'),
      document.fonts.load('600 30px "Playfair Display"'),
      document.fonts.load('700 22px Cinzel'),
      document.fonts.load('700 28px Inter'),
      document.fonts.load('600 22px Inter'),
    ]);
  }catch(e){}

  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#1c160d');
  bgGrad.addColorStop(0.5,'#0a0805');
  bgGrad.addColorStop(1,'#1c160d');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  const glow = ctx.createRadialGradient(W/2,260,40,W/2,260,700);
  glow.addColorStop(0,'rgba(232,197,101,0.22)');
  glow.addColorStop(1,'rgba(232,197,101,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';

  try{
    const crestImg = await loadImageEl(CREST_IMG_SRC);
    const cs = 210;
    const ratio = Math.min(cs/crestImg.width, cs/crestImg.height);
    const cw = crestImg.width*ratio, ch = crestImg.height*ratio;
    ctx.drawImage(crestImg, W/2-cw/2, 95, cw, ch);
  }catch(e){}

  ctx.fillStyle = 'rgba(232,197,101,.85)';
  ctx.font = '600 24px Inter';
  ctx.fillText('DON JULIO DE MILÁN · 3ª CEREMONIA', W/2, 358);

  const titleGrad = ctx.createLinearGradient(0,370,0,470);
  titleGrad.addColorStop(0,'#f2d878');
  titleGrad.addColorStop(0.55,'#cda43f');
  titleGrad.addColorStop(1,'#8a6a1f');
  ctx.fillStyle = titleGrad;
  ctx.font = '800 92px "Playfair Display"';
  ctx.fillText('VII IDEAL', W/2, 460);

  ctx.fillStyle = '#e9e4d2';
  ctx.font = '600 30px "Playfair Display"';
  ctx.fillText('Don Julio de Oro · Formación '+formation, W/2, 506);

  const pitchTop = 570, pitchBottom = 1740, pitchLeft = 90, pitchRight = W-90;
  const pitchW = pitchRight-pitchLeft, pitchH = pitchBottom-pitchTop;
  ctx.strokeStyle = 'rgba(232,197,101,.32)';
  ctx.lineWidth = 2;
  ctx.strokeRect(pitchLeft, pitchTop, pitchW, pitchH);
  ctx.beginPath();
  ctx.moveTo(pitchLeft, pitchTop+pitchH/2);
  ctx.lineTo(pitchRight, pitchTop+pitchH/2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(pitchLeft+pitchW/2, pitchTop+pitchH/2, pitchW*0.13, 0, Math.PI*2);
  ctx.stroke();

  const cardW = 208, cardH = 288;
  for(const slot of slots){
    const pid = state.ideal.slots[slot.id];
    const p = pid ? playerById(pid) : null;
    const cx = pitchLeft + (slot.x/100)*pitchW;
    const cy = pitchTop + (slot.y/100)*pitchH;
    await drawPlayerCardOnCanvas(ctx, p, cx, cy, cardW, cardH, slot.label);
  }

  ctx.fillStyle = 'rgba(232,197,101,.9)';
  ctx.font = '700 30px Inter';
  ctx.fillText('Elegido por '+state.name, W/2, 1808);
  ctx.fillStyle = 'rgba(233,228,210,.55)';
  ctx.font = '500 21px Inter';
  ctx.fillText('3ª Ceremonia del Don Julio de Oro', W/2, 1848);

  return canvas.toDataURL('image/png');
}

function computeFormationStats(ideals){
  const total = ideals.length;
  const byFormation = {};
  ideals.forEach(e=>{
    byFormation[e.formation] = byFormation[e.formation] || {count:0, voters:[]};
    byFormation[e.formation].count++;
    byFormation[e.formation].voters.push(e.name);
  });
  const arr = Object.keys(FORMATIONS).map(f=>{
    const d = byFormation[f] || {count:0, voters:[]};
    return {formation:f, count:d.count, voters:d.voters, pct: total ? Math.round(d.count/total*100) : 0};
  });
  arr.sort((a,b)=>b.count-a.count);
  return {arr, total};
}

function computePlayerStats(ideals){
  const total = ideals.length;
  const counts = {};
  ideals.forEach(e=>{
    e.slots.forEach(s=>{
      if(s.playerId) counts[s.playerId] = (counts[s.playerId]||0)+1;
    });
  });
  const arr = ALL_PLAYERS.map(p=>({
    player:p, count: counts[p.id]||0, pct: total ? Math.round((counts[p.id]||0)/total*100) : 0
  }));
  arr.sort((a,b)=>b.count-a.count);
  return {arr, total};
}

function computeConsensusLineup(ideals, winningFormation){
  const relevant = ideals.filter(e=>e.formation===winningFormation);
  const slots = getSlotPositions(winningFormation);
  const slotsByRole = {};
  slots.forEach(s=>{ (slotsByRole[s.role] = slotsByRole[s.role]||[]).push(s); });
  const roleTally = {};
  relevant.forEach(e=>{
    e.slots.forEach(s=>{
      if(!s.playerId) return;
      roleTally[s.role] = roleTally[s.role] || {};
      roleTally[s.role][s.playerId] = (roleTally[s.role][s.playerId]||0)+1;
    });
  });
  const assignment = {};
  Object.keys(slotsByRole).forEach(role=>{
    const roleSlots = slotsByRole[role];
    const ranked = Object.entries(roleTally[role]||{}).sort((a,b)=>b[1]-a[1]);
    roleSlots.forEach((slot,i)=>{
      if(ranked[i]){
        const [pid,count] = ranked[i];
        assignment[slot.id] = {playerId:pid, count, pct: relevant.length ? Math.round(count/relevant.length*100) : 0};
      }
    });
  });
  return {formation:winningFormation, slots, assignment, basedOn:relevant.length};
}

function renderConsensusPitch(consensus){
  const cards = consensus.slots.map(s=>{
    const a = consensus.assignment[s.id];
    const p = a ? playerById(a.playerId) : null;
    const inner = p ? futCardHtml(p, {showStats:false}) : '<div class="fc-outer"><div class="fc-inner"><div class="fc-pos" style="margin-top:34%;">'+s.label+'</div></div></div>';
    const badge = a ? '<div class="consensus-badge">'+a.pct+'%</div>' : '';
    return '<div class="slot-card '+(p?'':'slot-empty')+'" style="left:'+s.x+'%;top:'+s.y+'%;">'+badge+inner+'</div>';
  }).join('');
  return '<div class="pitch-field mt8">'+
      '<div class="border-in"></div><div class="hline"></div><div class="ccircle"></div>'+
      cards+
    '</div>';
}

function renderAdmin(){
  let content;
  if(state.adminLoading){
    content = '<div class="card"><div class="spinner"></div><div class="small-muted center">Cargando datos...</div></div>';
  } else {
    const ideals = state.adminData.ideals || [];
    if(!ideals.length){
      content = '<div class="card small-muted center">Aún no hay VII ideales enviados.</div>';
    } else {
      const fStats = computeFormationStats(ideals);
      const pStats = computePlayerStats(ideals);
      const winningFormation = fStats.arr[0].count > 0 ? fStats.arr[0].formation : null;
      const consensus = winningFormation ? computeConsensusLineup(ideals, winningFormation) : null;

      const formationBars = fStats.arr.map((f,i)=>{
        const leading = i===0 && f.count>0;
        const votersLine = f.voters.length ? '<div class="voters-inline">'+f.voters.map(escapeHtml).join(', ')+'</div>' : '';
        return '<div class="bar-row"><div class="bar-label"><span class="bar-name">'+(leading?'<span class="trophy">🏆</span> ':'')+f.formation+'</span><span class="bar-pct">'+f.pct+'% ('+f.count+')</span></div><div class="bar-bg"><div class="bar-fill'+(leading&&f.count>0?' leading':'')+'" style="width:'+f.pct+'%"></div></div>'+votersLine+'</div>';
      }).join('');

      const playerBars = pStats.arr.filter(r=>r.count>0).map((r,i)=>{
        const leading = i===0;
        return '<div class="bar-row"><div class="bar-label"><span class="bar-name">'+(leading?'<span class="trophy">🏆</span> ':'')+escapeHtml(r.player.name)+'</span><span class="bar-pct">'+r.pct+'% ('+r.count+')</span></div><div class="bar-bg"><div class="bar-fill'+(leading?' leading':'')+'" style="width:'+r.pct+'%"></div></div></div>';
      }).join('') || '<div class="small-muted">Sin datos aún.</div>';

      const rawList = ideals.map(entry=>{
        const chips = entry.slots.map(s=>{
          const p = playerById(s.playerId);
          return '<span class="ideal-chip '+(p&&p.isParche?'parche':'')+'">'+s.role+': '+escapeHtml(p?p.name:s.playerId)+'</span>';
        }).join('');
        return '<div class="ideal-log-card"><div class="meta"><span><b style="color:var(--ink)">'+escapeHtml(entry.name)+'</b></span><span>'+entry.formation+'</span></div><div class="ideal-log-players">'+chips+'</div></div>';
      }).join('');

      content =
        '<div class="card">'+
          '<div class="admin-section-title">Formaciones más votadas</div>'+
          formationBars+
        '</div>'+
        (consensus ? '<div class="card center">'+
          '<div class="admin-section-title" style="text-align:left;">Equipo consenso · formación '+winningFormation+'</div>'+
          '<div class="small-muted" style="margin-bottom:2px;">Calculado con los '+consensus.basedOn+' VII Ideal(es) que usaron esta formación</div>'+
          renderConsensusPitch(consensus)+
        '</div>' : '')+
        '<div class="card">'+
          '<div class="admin-section-title">% de votos por jugador</div>'+
          '<div class="small-muted" style="margin-bottom:10px;">En cuántos VII Ideal apareció cada jugador</div>'+
          playerBars+
        '</div>'+
        '<div class="card">'+
          '<div class="admin-section-title">Detalle de cada envío</div>'+
          rawList+
        '</div>';
    }
  }
  return headerHtml('Panel Admin', false) +
    '<button class="btn btn-outline" data-action="refreshAdmin" style="margin-bottom:14px;">Actualizar</button>' +
    '<div class="small-muted center mt8" style="margin-bottom:14px;">'+(state.adminData.ideals?state.adminData.ideals.length:0)+' VII Ideal(es) recibidos</div>'+
    content;
}

async function loadAdminData(){
  state.adminLoading = true; render();
  const ideals = await getAllIdeal();
  state.adminData = {ideals};
  state.adminLoading = false;
  render();
}

/* ---------- EVENT HANDLING ---------- */
function attachEvents(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  const overlay = document.querySelector('.overlay');
  if(overlay){
    overlay.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click', onAction));
  }
  const nameInput = document.getElementById('nameInput');
  if(nameInput) nameInput.addEventListener('input', e=>{ state.name = e.target.value; });
  const adminPassInput = document.getElementById('adminPassInput');
  if(adminPassInput) adminPassInput.addEventListener('keydown', e=>{ if(e.key==='Enter') checkAdminPassword(); });
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.getAttribute('data-action');
  if(!action) return;
  const fnMap = {
    startVoting, pickFormation, poolClick, slotClick,
    submitIdealBtn, restartFormation, restartAll, cancelConfirm, confirmVote,
    closeAdminLogin, checkAdminPassword, refreshAdmin, setPoolFilter,
    downloadIdealImage, shareIdealImage
  };
  if(fnMap[action]) fnMap[action](el);
}

function startVoting(){
  const nameVal = (document.getElementById('nameInput')||{}).value || state.name;
  if(!nameVal || !nameVal.trim()){
    document.getElementById('nameError').style.display='block';
    return;
  }
  state.name = nameVal.trim();
  state.screen = 'ideal-formation';
  render();
}

function pickFormation(el){
  const f = el.getAttribute('data-formation');
  state.ideal = {formation:f, slots:{}};
  state.selectedPlayerId = null;
  state.poolFilter = 'todos';
  state.idealCelebrated = false;
  state.screen = 'ideal-builder';
  render();
}

function setPoolFilter(el){
  state.poolFilter = el.getAttribute('data-filter');
  render();
}

function poolClick(el){
  const pid = el.getAttribute('data-player-id');
  const p = playerById(pid);
  const usedIds = Object.values(state.ideal.slots);
  const usedParche = usedIds.some(id=>{const pp=playerById(id); return pp && pp.isParche;});
  if(p.isParche && usedParche){
    alert('Solo puedes tener 1 parche en tu VII Ideal.');
    return;
  }
  state.selectedPlayerId = (state.selectedPlayerId===pid) ? null : pid;
  render();
}

function slotClick(el){
  const slotEl = el.hasAttribute('data-slot-id') ? el : el.closest('[data-slot-id]');
  const slotId = slotEl.getAttribute('data-slot-id');
  const currentPid = state.ideal.slots[slotId];
  if(currentPid && !state.selectedPlayerId){
    delete state.ideal.slots[slotId];
    state.idealCelebrated = false;
    render();
    return;
  }
  if(state.selectedPlayerId){
    const p = playerById(state.selectedPlayerId);
    const usedIds = Object.values(state.ideal.slots).filter(id=>id!==currentPid);
    const usedParche = usedIds.some(id=>{const pp=playerById(id); return pp && pp.isParche;});
    if(p.isParche && usedParche){
      alert('Solo puedes tener 1 parche en tu VII Ideal.');
      return;
    }
    state.ideal.slots[slotId] = state.selectedPlayerId;
    state.selectedPlayerId = null;
    state.lastPlacedSlot = slotId;
    render();

    const totalSlots = getSlotPositions(state.ideal.formation).length;
    if(Object.keys(state.ideal.slots).length === totalSlots && !state.idealCelebrated){
      state.idealCelebrated = true;
      fireConfetti();
    }
  }
}

function submitIdealBtn(){
  const slots = getSlotPositions(state.ideal.formation);
  const totalSlots = slots.length;
  if(Object.keys(state.ideal.slots).length !== totalSlots) return;
  state.pendingConfirm = {
    message:'¿Enviar tu VII Ideal con formación '+state.ideal.formation+'? No podrás verlo ni modificarlo después.',
    onConfirm: async ()=>{
      const slotData = slots.map(s=>({slotId:s.id, role:s.role, playerId:state.ideal.slots[s.id]}));
      await submitIdeal({name:state.name, formation:state.ideal.formation, slots:slotData, ts:Date.now()});
      state.pendingConfirm = null;
      state.screen = 'thanks';
      state.idealImageDataUrl = null;
      state.idealImageLoading = true;
      render();
      fireConfetti();
      try{
        state.idealImageDataUrl = await buildIdealImage();
      }catch(e){ console.error('image build failed', e); }
      state.idealImageLoading = false;
      render();
    }
  };
  render();
}

function restartFormation(){
  state.ideal = {formation:null, slots:{}};
  state.selectedPlayerId = null;
  state.idealCelebrated = false;
  state.screen = 'ideal-formation';
  render();
}

function restartAll(){ location.reload(); }

function cancelConfirm(){ state.pendingConfirm = null; render(); }
function confirmVote(){
  const pc = state.pendingConfirm;
  if(pc && pc.onConfirm) pc.onConfirm();
}

function closeAdminLogin(){ state.showAdminLogin=false; render(); }

function checkAdminPassword(){
  const val = (document.getElementById('adminPassInput')||{}).value || '';
  if(val === ADMIN_PASS){
    state.showAdminLogin = false;
    state.adminError = false;
    state.screen = 'admin';
    render();
    loadAdminData();
    startAdminPolling();
  } else {
    state.adminError = true;
    render();
  }
}

function refreshAdmin(){ loadAdminData(); }

let adminPollInterval = null;
function startAdminPolling(){
  if(adminPollInterval) clearInterval(adminPollInterval);
  adminPollInterval = setInterval(()=>{
    if(state.screen==='admin' && !state.adminLoading) loadAdminData();
  }, 8000);
}

function downloadIdealImage(){
  if(!state.idealImageDataUrl) return;
  const a = document.createElement('a');
  a.href = state.idealImageDataUrl;
  a.download = 'vii-ideal-'+(state.name||'djm').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function shareIdealImage(){
  if(!state.idealImageDataUrl) return;
  try{
    const res = await fetch(state.idealImageDataUrl);
    const blob = await res.blob();
    const file = new File([blob], 'vii-ideal-djm.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Mi VII Ideal · Don Julio de Oro', text:'Este es mi VII Ideal de la temporada'});
      return;
    }
  }catch(e){ console.error('share failed', e); }
  downloadIdealImage();
}

(async function init(){
  const wm = document.getElementById('crest-watermark');
  if(wm) wm.style.backgroundImage = 'url('+CREST_IMG_SRC+')';
  await ensureVersion();
  render();
})();
</script>
</body>
</html>
